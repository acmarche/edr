# Rich text editor (mati365/ckeditor5-symfony), self-hosted under the GPL license.
# Images are uploaded to PageController::uploadImage (public/files/pages).
ckeditor5:
    presets:
        edr:
            editorType: classic
            config:
                toolbar:
                    items:
                        - undo
                        - redo
                        - '|'
                        - heading
                        - '|'
                        - bold
                        - italic
                        - underline
                        - strikethrough
                        - '|'
                        - fontColor
                        - alignment
                        - '|'
                        - link
                        - insertImage
                        - blockQuote
                        - insertTable
                        - '|'
                        - bulletedList
                        - numberedList
                        - outdent
                        - indent
                plugins:
                    - Essentials
                    - Paragraph
                    - Heading
                    - Bold
                    - Italic
                    - Underline
                    - Strikethrough
                    - FontColor
                    - Alignment
                    - Link
                    - AutoLink
                    - BlockQuote
                    - Table
                    - TableToolbar
                    - List
                    - Indent
                    - Autoformat
                    - PasteFromOffice
                    - TextTransformation
                    - Image
                    - ImageCaption
                    - ImageInsert
                    - ImageResize
                    - ImageStyle
                    - ImageTextAlternative
                    - ImageToolbar
                    - ImageUpload
                    - LinkImage
                    - SimpleUploadAdapter
                link:
                    defaultProtocol: 'https://'
                image:
                    toolbar:
                        - 'imageStyle:inline'
                        - 'imageStyle:alignLeft'
                        - 'imageStyle:alignCenter'
                        - 'imageStyle:alignRight'
                        - '|'
                        - imageTextAlternative
                        - toggleImageCaption
                        - linkImage
                simpleUpload:
                    uploadUrl: '/admin/page/upload-image'
                table:
                    contentToolbar: [tableColumn, tableRow, mergeTableCells]
